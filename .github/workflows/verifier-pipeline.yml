# Rejoue le parcours des TP dans l'image des TP, avec un vrai serveur MLflow, et vérifie
# que les chiffres annoncés dans le support sont toujours obtenus (voir verification/).
# Se lance à chaque modification du code, des données ou de la vérification, ou à la main.
name: Vérification du pipeline

on:
  push:
    paths:
      - "colisvert/**"
      - "pipeline/**"
      - "solutions/**"
      - "verification/**"
      - "docker/airflow/**"
      - "MLproject"
      - "docker-compose.yml"
      - ".github/workflows/verifier-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Rejouer les jours 1 à 3 matin dans l'image des TP
        run: |
          set -o pipefail
          # Avec l'UID de l'utilisateur et son identité, comme sur la VM (docker-compose.yml).
          ./scripts/identite.sh
          docker run --rm --add-host mlflow:127.0.0.1 --user "$(id -u):$(id -g)" \
            -v "$PWD":/home/lab/projet -w /home/lab/projet \
            -v "$PWD/.home/passwd":/etc/passwd:ro -v "$PWD/.home/group":/etc/group:ro \
            ghcr.io/saahmathworks/dataops-lab:2026.12 \
            bash verification/verifier_pipeline.sh 2>&1 | tee rapport-verification.txt
      - name: Rejouer le jour 3 après-midi (Airflow) avec docker compose, comme sur la VM
        run: |
          set -o pipefail
          ./scripts/identite.sh
          mkdir -p .mlflow .airflow dags
          docker compose build airflow
          docker compose up -d mlflow airflow
          bash verification/verifier_airflow.sh 2>&1 | tee rapport-airflow.txt
      - name: Garder les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-verification
          path: |
            rapport-verification.txt
            rapport-airflow.txt
