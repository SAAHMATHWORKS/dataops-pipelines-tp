# Construit l'image Airflow des TP (jour 3) PAR-DESSUS l'image des TP, et la publie sous
# ghcr.io/saahmathworks/dataops-lab:2026.12-airflow (même paquet, déjà public).
# Se lance quand docker/airflow/ change, après chaque reconstruction de l'image des TP,
# ou à la main (onglet Actions, « Run workflow »).
name: Image Airflow des TP

on:
  push:
    branches: [main]
    paths: ["docker/airflow/**", ".github/workflows/image-airflow.yml"]
  workflow_run:
    workflows: ["Image des TP"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/saahmathworks/dataops-lab

jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier (Intel/AMD et ARM)
        uses: docker/build-push-action@v6
        with:
          context: docker/airflow
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:2026.12-airflow
            ${{ env.IMAGE }}:${{ github.sha }}-airflow
      - name: Extraire la liste exacte des versions d'Airflow
        run: |
          docker run --rm --platform linux/amd64 ${{ env.IMAGE }}:2026.12-airflow cat /requirements-airflow.lock > requirements-airflow.lock
          docker run --rm --platform linux/amd64 ${{ env.IMAGE }}:2026.12-airflow airflow version
      - uses: actions/upload-artifact@v4
        with:
          name: requirements-airflow.lock
          path: requirements-airflow.lock
