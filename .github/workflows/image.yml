# Construit l'image des TP et la publie sur ghcr.io/saahmathworks/dataops-lab.
# Se lance à chaque modification de docker/lab/, ou à la main (onglet Actions, « Run workflow »).
name: Image des TP

on:
  push:
    branches: [main]
    paths: ["docker/lab/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/saahmathworks/dataops-lab

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier (Intel/AMD et ARM)
        uses: docker/build-push-action@v6
        with:
          context: docker/lab
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:2026.12
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Extraire la liste exacte des versions
        run: |
          docker run --rm --platform linux/amd64 ${{ env.IMAGE }}:2026.12 cat /requirements.lock > requirements.lock
          docker run --rm --platform linux/amd64 ${{ env.IMAGE }}:2026.12 python -c "import pandas, mlflow, dvc, optuna, evidently, sklearn, pyspark, delta; print('pandas', pandas.__version__, '| mlflow', mlflow.__version__, '| optuna', optuna.__version__, '| pyspark', pyspark.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: requirements.lock
          path: requirements.lock
